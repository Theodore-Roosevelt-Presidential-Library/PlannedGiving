name: Annual tax-figure review reminder

on:
  schedule:
    # 1 November (IRS inflation adjustments are usually out) and 5 January (backstop). Times are UTC.
    - cron: '0 14 1 11 *'
    - cron: '0 14 5 1 *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read current tax year
        id: meta
        run: |
          echo "tax_year=$(grep -oE 'taxYear: *[0-9]{4}' src/tax-data.js | grep -oE '[0-9]{4}')" >> "$GITHUB_OUTPUT"
          echo "reviewed=$(grep -oE "lastReviewed: *'[0-9-]+'" src/tax-data.js | grep -oE '[0-9-]+')" >> "$GITHUB_OUTPUT"
      - name: Open the review issue
        uses: actions/github-script@v7
        with:
          script: |
            const taxYear = Number('${{ steps.meta.outputs.tax_year }}');
            const next = taxYear + 1;
            const title = `Tax-figure review for ${next} (currently ${taxYear}, last reviewed ${{ steps.meta.outputs.reviewed }})`;
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'tax-review' });
            if (open.some(i => i.title === title)) { core.info('Issue already open'); return; }
            const checklist = require('fs').readFileSync('docs/TAX-REVIEW.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, labels: ['tax-review'],
              body: `The calculators currently reflect tax year **${taxYear}**. The IRS should have published the **${next}** inflation adjustments by now.\n\nWork through the checklist below (from docs/TAX-REVIEW.md), update \`src/tax-data.js\`, rebuild, and close this issue.\n\n---\n\n${checklist}`
            });
